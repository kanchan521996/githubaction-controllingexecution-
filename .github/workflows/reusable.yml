name: Reusable deploy
on: 
  workflow_call:
    inputs:
        artifact-name:
          description: The name of the deployed artifact
          required: false
          default: dist
          type: string
jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
        - name: Get code
          uses: actions/download-artifact@v4
          with:
            name: ${{ inputs.artifact-name }}
        - name: list file
          run: ls
        - name: Output info
          run: echo "Deploying & uploading"