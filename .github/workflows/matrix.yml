name: mateix Demo
on: push
jobs:
  build:
    continue-on-error: true
    strategy:
        matrix:
            node-version: [12,14,16,20]
            os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Get code
        uses: actions/checkout@v4
      - name: Install Nodejs
        uses: actions/setup-node@v4
        with:
          node-version: ${{matrix.node-version}}
      - name: Install dependency
        run: npm ci
      - name: Build project
        run: npm run build
